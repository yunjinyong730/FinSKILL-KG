name: readme-media

on:
  push:
    branches:
      - align-proposal-evaluation
    paths:
      - app.py
      - src/**
      - skills/**
      - data/**
      - config/**
      - scripts/capture_readme_media.py
      - requirements.txt
      - requirements-dev.txt
      - .github/workflows/readme-media.yml

permissions:
  contents: write

jobs:
  capture:
    if: "!contains(github.event.head_commit.message, 'Update README media')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align-proposal-evaluation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/capture_readme_media.py

      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          if git diff --cached --quiet; then
            echo "No media changes"
          else
            git commit -m "Update README media [skip ci]"
            git push origin HEAD:align-proposal-evaluation
          fi
